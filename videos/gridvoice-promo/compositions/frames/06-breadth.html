              <span class="gv06-tag gv06-mono">billing</span>
            </div>
            <div class="gv06-payload">“Why is my bill higher?” — answered from the account.</div>
          </div>

          <div class="gv06-card" id="gv06-card3">
            <div class="gv06-card-head">
              <span class="gv06-stamp gv06-mono">9:15 am</span>
              <span class="gv06-tag gv06-mono">service</span>
            </div>
            <div class="gv06-payload">Technician visit booked. Window confirmed.</div>
          </div>

          <div class="gv06-card" id="gv06-card4">
            <div id="gv06-accent"></div>
            <div class="gv06-card-head">
              <span class="gv06-stamp gv06-mono">any hour</span>
              <span class="gv06-tag gv06-mono">warm handoff</span>
            </div>
            <div class="gv06-payload">
              Full context to
              <span class="gv06-glow" data-word="your">your</span>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var DUR = 7.275;
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["06-breadth"] = tl;

        /* macro camera move under the whole shot */
        tl.fromTo("#gv06-cam", { scale: 1 }, { scale: 1.03, duration: DUR, ease: "none" }, 0);

        /* Scene 1 (0–1.6) · canvas lifts one step toward pre-dawn navy */
        tl.fromTo("#gv06-dawn", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power1.inOut" }, 0);

        /* ghost depth layer — slow parallax drift, slower reveal */
        tl.fromTo(
          "#gv06-ghost-word",
          { y: 26, scale: 1.02 },
          { y: -26, scale: 1.09, duration: DUR, ease: "none" },
          0,
        );
        tl.fromTo("#gv06-ghost-word", { opacity: 0 }, { opacity: 0.04, duration: 1.6, ease: "power1.out" }, 0.15);

        /* "by morning" — per-word reveal (dynamic-content-sequencing: computed word grid) */
        var WORD_BASE = 0.12;
        var WORD_STEP = 0.22;
        ["#gv06-w1", "#gv06-w2"].forEach(function (sel, i) {
          tl.fromTo(
            sel,
            { yPercent: 55, opacity: 0 },
            { yPercent: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
            WORD_BASE + i * WORD_STEP,
          );
        });

        /* chrome + kicker + overnight-log clock */
        tl.fromTo(
          "#gv06-chrome",
          { y: -12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
          0.45,
        );
        tl.fromTo(
          "#gv06-kicker",
          { y: 10, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          0.55,
        );
        tl.fromTo(
          "#gv06-clockbox",
          { y: -10, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          0.85,
        );

        /* Card cascade — pre-computed once from VO cues (dynamic-content-sequencing),
           each arrival a spring-pop-entrance (smooth power3 settle, fromTo, no overshoot) */
        var CARDS = [
          { sel: "#gv06-card1", at: 0.95 },
          { sel: "#gv06-card2", at: 2.3 },
          { sel: "#gv06-card3", at: 3.55 },
          { sel: "#gv06-card4", at: 5.0 },
        ];
        CARDS.forEach(function (c) {
          tl.fromTo(
            c.sel,
            { scale: 0, opacity: 0, y: 24 },
            { scale: 1, opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
            c.at,
          );
          tl.fromTo(
            c.sel + " .gv06-card-head",
            { y: 10, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
            c.at + 0.12,
          );
          tl.fromTo(
            c.sel + " .gv06-payload",
            { y: 12, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
            c.at + 0.24,
          );
        });

        /* Scene 2 · full-width strip evolves into the grid */
        tl.fromTo(
          "#gv06-card1",
          { width: "89cqw" },
          { width: "43.9cqw", duration: 0.7, ease: "power3.inOut" },
          1.7,
        );

        /* Scene 3 · amber left-edge accent on the handoff card */
        tl.fromTo(
          "#gv06-accent",
          { scaleY: 0 },
          { scaleY: 1, duration: 0.45, ease: "power3.out" },
          5.18,
        );

        /* Single linear driver: advancing overnight clock + asr-keyword-glow on "your team" */
        var ATTACK = 0.15;
        var RELEASE = 0.35;
        var REST_LEVEL = 0.15;
        var MAX_BLUR = 30;
        var MAX_SCALE = 0.16;
        var REST_RGB = { r: 244, g: 246, b: 251 };
        var ACTIVE_RGB = { r: 255, g: 179, b: 0 };
        var TIMINGS = {
          your: { start: 5.35, end: 5.65 },
          team: { start: 5.65, end: 6.15 },
        };
        var CLOCKS = [
          { t: 0, label: "3:41 am" },
          { t: 2.3, label: "8:02 am" },
          { t: 3.55, label: "9:15 am" },
        ];

        function envelope(time, start, end) {
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / ATTACK, 1);
          var releaseEnd = end + RELEASE;
          if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
          return REST_LEVEL;
        }
        function ch(a, b, t) {
          return Math.round(a + (b - a) * t);
        }

        var glowWords = document.querySelectorAll(".gv06-glow");
        var clockEl = document.getElementById("gv06-clock");
        var lastClock = "";
        var driver = { t: 0 };

        tl.to(
          driver,
          {
            t: DUR,
            duration: DUR,
            ease: "none",
            onUpdate: function () {
              /* timestamps advance — swap only on transitions */
              var label = CLOCKS[0].label;
              for (var i = CLOCKS.length - 1; i >= 0; i--) {
                if (driver.t >= CLOCKS[i].t) {
                  label = CLOCKS[i].label;
                  break;
                }
              }
              if (label !== lastClock) {
                clockEl.textContent = label;
                lastClock = label;
              }
              /* keyword glow envelopes */
              glowWords.forEach(function (el) {
                var timing = TIMINGS[el.dataset.word];
                if (!timing) return;
                var env = envelope(driver.t, timing.start, timing.end);
                el.style.color =
                  "rgb(" +
                  ch(REST_RGB.r, ACTIVE_RGB.r, env) +
                  "," +
                  ch(REST_RGB.g, ACTIVE_RGB.g, env) +
                  "," +
                  ch(REST_RGB.b, ACTIVE_RGB.b, env) +
                  ")";
                el.style.textShadow =
                  "0 0 " + MAX_BLUR * env + "px rgba(255,179,0," + 0.85 * env + ")";
                el.style.transform = "scale(" + (1 + MAX_SCALE * env) + ")";
              });
            },
          },
          0,
        );
      })();
    </script>
