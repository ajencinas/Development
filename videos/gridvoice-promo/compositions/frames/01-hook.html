<template>
  <style>
    /* ---- Fonts (frame.md families; latin subsets) ---- */
    @font-face {
      font-family: "Barlow";
      font-style: normal;
      font-weight: 900;
      font-display: block;
      src: url(https://fonts.gstatic.com/s/barlow/v13/7cHqv4kjgoGqM7E3j-ws51ostz0rdg.woff2) format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgsAXHNk.woff2) format("woff2");
    }

    /* ---- Frame root (styled via #root only) ---- */
    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      container-type: size;
    }

    /* ---- Track 0: storm-navy ground, 3 depth layers (grid -> vignette -> type plane above) ---- */
    .hk01-bg {
      position: absolute;
      inset: 0;
      background: #0b1120; /* ink-black storm-navy field */
    }
    .hk01-grid {
      position: absolute;
      inset: -6%;
      opacity: 0.55; /* driven darker by the lights-out flicker */
      background-image:
        repeating-linear-gradient(
          to right,
          rgba(244, 246, 251, 0.045) 0px,
          rgba(244, 246, 251, 0.045) 1px,
          transparent 1px,
          transparent 120px
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(244, 246, 251, 0.045) 0px,
          rgba(244, 246, 251, 0.045) 1px,
          transparent 1px,
          transparent 120px
        );
      will-change: transform, opacity;
    }
    .hk01-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 120% 95% at 50% 42%,
        rgba(0, 0, 0, 0) 48%,
        rgba(3, 5, 12, 0.62) 100%
      );
    }

    /* ---- Track 1: type plane ---- */
    .hk01-content {
      position: absolute;
      inset: 0;
    }
    .hk01-cam {
      position: absolute;
      inset: 0;
      will-change: transform;
    }
    .hk01-plane {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    /* mono chrome timestamp — upper-left, top-third, small, alone */
    .hk01-stamp {
      position: absolute;
      left: 5.5cqw;
      top: 17cqh;
      display: flex;
      align-items: center;
      white-space: pre;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 1.7cqw;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .hk01-stamp-text {
      white-space: pre;
      min-width: 12cqw; /* >= widest state — no right-edge jitter */
      color: #f4f6fb;
    }
    .hk01-caret {
      display: inline-block;
      width: 0.55cqw;
      height: 1.9cqw;
      margin-left: 0.15cqw;
      background: #f4f6fb;
    }

    /* the statement — massive lowercase Barlow 900, centered */
    .hk01-statement {
      position: absolute;
      left: 5.5cqw;
      right: 5.5cqw;
      top: 39cqh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.4cqh;
      text-align: center;
    }
    .hk01-line1 {
      display: flex;
      justify-content: center;
      gap: 1.9cqw;
      font-family: "Barlow", sans-serif;
      font-weight: 900;
      font-size: 7cqw;
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-transform: lowercase;
      color: #f4f6fb;
    }
    .hk01-line2 {
      display: flex;
      justify-content: center;
      gap: 1.15cqw;
      font-family: "Barlow", sans-serif;
      font-weight: 900;
      font-size: 4.6cqw;
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: lowercase;
      color: #f4f6fb;
    }
    .hk01-w,
    .hk01-w2 {
      display: inline-block;
      will-change: transform, opacity, filter;
    }
    .hk01-out {
      color: #ffb300; /* the one orange clause — the keyword that kills the lights */
    }
    .hk01-out-core {
      display: inline-block;
      transform-origin: 50% 50%;
    }

    /* ---- Track 2: lights-out dim (above everything — the whole canvas takes a step down) ---- */
    .hk01-dim {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .hk01-dim-field {
      position: absolute;
      inset: 0;
      background: #04060d;
      opacity: 0;
    }
  </style>

  <div
    id="root"
    data-composition-id="01-hook"
    data-width="1920"
    data-height="1080"
    data-duration="4.203"
  >
    <!-- Scene ground: grid -> vignette (type plane rides above on track 1) -->
    <div class="clip hk01-bg" data-start="0" data-duration="4.203" data-track-index="0">
      <div class="hk01-grid" id="hk01-grid"></div>
      <div class="hk01-vignette"></div>
    </div>

    <!-- Type plane -->
    <div class="clip hk01-content" data-start="0" data-duration="4.203" data-track-index="1">
      <div class="hk01-cam" id="hk01-cam">
        <div class="hk01-plane" id="hk01-plane">
          <div class="hk01-stamp">
            <span class="hk01-stamp-text" id="hk01-stamp-text"></span><span class="hk01-caret" id="hk01-caret"></span>
          </div>

          <div class="hk01-statement">
            <div class="hk01-line1">
              <span class="hk01-w" id="hk01-w1">a</span>
              <span class="hk01-w" id="hk01-w2">storm</span>
              <span class="hk01-w" id="hk01-w3">just</span>
              <span class="hk01-w" id="hk01-w4">took</span>
            </div>
            <div class="hk01-line2" id="hk01-line2">
              <span class="hk01-w2">the</span>
              <span class="hk01-w2">power</span>
              <span class="hk01-w2 hk01-out"><span class="hk01-out-core" id="hk01-out-core">out</span></span>
              <span class="hk01-w2">on</span>
              <span class="hk01-w2">maple</span>
              <span class="hk01-w2">street.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Lights-out dim layer -->
    <div class="clip hk01-dim" data-start="0" data-duration="4.203" data-track-index="2">
      <div class="hk01-dim-field" id="hk01-dim-field"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const DUR = 4.203;
      const CREAM = "#F4F6FB";
      const ORANGE = "#FFB300";

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* =============================================================
       * Scene 1 (0.0-1.2s) — "2:14 AM" types on with a caret
       * discrete-text-sequence + context-sensitive-cursor
       * ============================================================= */
      const SEQ = [
        { t: 0.0, text: "", c: CREAM },
        { t: 0.14, text: "2", c: CREAM },
        { t: 0.3, text: "2:", c: CREAM },
        { t: 0.42, text: "2:1", c: CREAM },
        { t: 0.55, text: "2:14", c: CREAM },
        { t: 0.74, text: "2:14 A", c: CREAM },
        { t: 0.88, text: "2:14 AM", c: CREAM },
        { t: 1.1, text: "2:14 AM", c: ORANGE }, // segment shift: the timestamp "lands" in accent chrome
      ];
      function seqAt(time) {
        for (let i = SEQ.length - 1; i >= 0; i--) {
          if (time >= SEQ[i].t) return SEQ[i];
        }
        return SEQ[0];
      }
      // Baked typing events — seek-safe solid-cursor grace (no mutable trackers)
      const CHANGE_TIMES = SEQ.filter((e, i) => i > 0 && e.text !== SEQ[i - 1].text).map((e) => e.t);
      const TYPING_GRACE = 0.16;
      const BLINK_CYCLES = 6; // whole number over DUR -> period 0.7s, no last-frame pop

      /* =============================================================
       * Scene 2 (1.2-2.6s) — kinetic-beat-slam: one tempo grid,
       * distinct entrance per word, each on its VO beat
       * ============================================================= */
      const PULSE = 0.35;
      const BEATS = [1.26, 1.26 + PULSE, 1.26 + PULSE * 2, 1.26 + PULSE * 3];

      tl.fromTo(
        "#hk01-w1",
        { scale: 1.6, filter: "blur(14px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power4.out" },
        BEATS[0]
      );
      tl.fromTo(
        "#hk01-w2",
        { x: -260, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" },
        BEATS[1]
      );
      tl.fromTo(
        "#hk01-w3",
        { y: 84, rotation: 4, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" },
        BEATS[2]
      );
      tl.fromTo(
        "#hk01-w4",
        { scale: 0.55, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.4)" },
        BEATS[3]
      );

      /* =============================================================
       * Scene 3 (2.6-3.7s) — line 2 per-word staggered reveal
       * dynamic-content-sequencing: cues computed from content length,
       * pre-computed once at build
       * ============================================================= */
      const LINE2_START = 2.56;
      const BASE_WORD = 0.1;
      const SEC_PER_CHAR = 0.026;
      let outStart = 2.94; // overwritten by the computed cue for "out"
      let cursor = LINE2_START;
      gsap.utils.toArray(".hk01-line2 .hk01-w2").forEach((el) => {
        const start = cursor;
        cursor += BASE_WORD + el.textContent.trim().length * SEC_PER_CHAR;
        if (el.classList.contains("hk01-out")) outStart = start + 0.04;
        tl.fromTo(
          el,
          { y: 44, opacity: 0, filter: "blur(6px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "power3.out" },
          start
        );
      });

      /* asr-keyword-glow (inverted): "out" gets the envelope; the canvas dims
       * instead of blooming. Envelope decays to a high rest level — the dark holds. */
      const OUT_END = outStart + 0.36;
      const ATTACK = 0.16;
      const RELEASE = 0.45;
      const REST_LEVEL = 0.82;
      const DIM_MAX = 0.46;
      const OUT_MAX_BLUR = 24;
      const OUT_SCALE_BOOST = 0.07;
      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK, 1);
        const releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      /* Grid flicker — pure function of driver time: one hard flicker on "out",
       * then the grid settles dimmer (the lights went out). */
      function gridOpacityAt(time) {
        if (time < outStart) return 0.55;
        if (time < outStart + 0.1) return 0.07;
        return 0.38;
      }

      /* =============================================================
       * Scene 4 (3.7-4.2s) — held darker read, subtle jitter only
       * sine-wave-loop, low amplitude, starts and ends at zero offset
       * ============================================================= */
      const JITTER_START = 3.7;
      const JITTER_DUR = DUR - JITTER_START;

      /* =============================================================
       * The single linear driver — typing, caret, envelope dim,
       * grid flicker, and jitter are all pure functions of t
       * ============================================================= */
      const stampText = document.getElementById("hk01-stamp-text");
      const caret = document.getElementById("hk01-caret");
      const gridEl = document.getElementById("hk01-grid");
      const dimField = document.getElementById("hk01-dim-field");
      const outCore = document.getElementById("hk01-out-core");
      const plane = document.getElementById("hk01-plane");

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none", // linear — t maps 1:1 to scene time
          onUpdate: () => {
            const t = driver.t;

            // -- typing + context-sensitive caret --
            const entry = seqAt(t);
            stampText.textContent = entry.text;
            stampText.style.color = entry.c;
            caret.style.background = entry.c;
            const isTyping = CHANGE_TIMES.some((ct) => ct <= t && t - ct < TYPING_GRACE);
            const blinkP = (t / DUR) * Math.PI * 2 * BLINK_CYCLES;
            caret.style.opacity = isTyping ? "1" : Math.sin(blinkP) >= 0 ? "1" : "0";

            // -- inverted keyword glow: the lights-out dim --
            const env = envelope(t, outStart, OUT_END);
            dimField.style.opacity = String(DIM_MAX * env);
            outCore.style.textShadow = `0 0 ${OUT_MAX_BLUR * env}px rgba(255, 179, 0, ${0.55 * env})`;
            outCore.style.transform = `scale(${1 + OUT_SCALE_BOOST * env})`;

            // -- grid flicker (once), then settle darker --
            gridEl.style.opacity = String(gridOpacityAt(t));

            // -- Scene 4 subtle jitter (zero at both ends of its window) --
            if (t >= JITTER_START) {
              const p = ((t - JITTER_START) / JITTER_DUR) * Math.PI * 2;
              const jx = Math.sin(p * 3) * 0.8;
              const jy = Math.sin(p * 2) * 1.2;
              plane.style.transform = `translate(${jx}px, ${jy}px)`;
            } else {
              plane.style.transform = "translate(0px, 0px)";
            }
          },
        },
        0
      );

      /* Macro camera: slow push-in on the type plane, grid drifts faster — depth parallax */
      tl.fromTo(
        "#hk01-cam",
        { scale: 1, transformOrigin: "50% 46%" },
        { scale: 1.022, duration: DUR, ease: "none" },
        0
      );
      tl.fromTo(
        "#hk01-grid",
        { scale: 1, transformOrigin: "50% 46%" },
        { scale: 1.05, duration: DUR, ease: "none" },
        0
      );

      window.__timelines["01-hook"] = tl;
    })();
  </script>
</template>
