    <script>
      (function () {
        // ── deterministic waveform geometry (layered sines, no randomness) ──
        var N = 56;
        var X0 = 20;
        var W = 800;
        var CY = 120;
        var AMPS = [];
        for (var i = 0; i < N; i++) {
          var t = i / (N - 1);
          var env = Math.pow(Math.sin(Math.PI * t), 0.7) * 92;
          AMPS.push(env * (0.62 * Math.sin(i * 0.9 + 0.6) + 0.38 * Math.sin(i * 2.3 + 1.7)));
        }
        var wave = document.getElementById("f07cta-wave");
        function waveD(flat) {
          // flat: 0 = full waveform, 1 = dead-flat line
          var d = "";
          for (var i = 0; i < N; i++) {
            var x = X0 + (W * i) / (N - 1);
            var y = CY - AMPS[i] * (1 - flat);
            d += (i === 0 ? "M " : " L ") + x.toFixed(2) + " " + y.toFixed(2);
          }
          return d;
        }
        wave.setAttribute("d", waveD(0));

        // svg-path-draw setup: measured length, never guessed
        var len = wave.getTotalLength() * 1.05;
        wave.style.strokeDasharray = String(len);
        wave.style.strokeDashoffset = String(len);

        var glow = document.getElementById("f07cta-glow");
        var stage = document.getElementById("f07cta-stage");

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        window.__timelines["07-cta"] = tl;

        /* ── Scene 1 (0.0-2.6s) · kinetic-beat-slam: one beat array, VO-cued,
               distinct entrance per phrase, hard-cut replacements ── */
        var BEATS = [0.12, 1.42, 2.12]; // "in seconds." / "24/7." / "at any scale."

        tl.fromTo(
          "#f07cta-c1",
          { scale: 1.45, filter: "blur(14px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
          BEATS[0]
        );
        tl.set("#f07cta-c1", { opacity: 0 }, BEATS[1]); // hard cut
        tl.fromTo(
          "#f07cta-c2",
          { x: -300, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
          BEATS[1]
        );
        tl.set("#f07cta-c2", { opacity: 0 }, BEATS[2]); // hard cut
        tl.fromTo(
          "#f07cta-c3",
          { y: 80, rotation: 4, opacity: 0 },
          { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" },
          BEATS[2]
        );
        tl.set("#f07cta-c3", { opacity: 0 }, 2.62); // stage clears

        /* ── Scene 2 (2.6-5.0s) · svg-path-draw: the amber waveform traces on ── */
        tl.to(
          "#f07cta-wave",
          { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" },
          2.7
        );

        // svg-icon-enrichment: one pulse — SVG transform ATTRIBUTE around the
        // explicit center (the CSS transform-origin/fill-box trap is real).
        var pulse = { p: 0 };
        tl.to(
          pulse,
          {
            p: Math.PI,
            duration: 0.5,
            ease: "none",
            onUpdate: function () {
              var s = 1 + Math.sin(pulse.p) * 0.1;
              wave.setAttribute(
                "transform",
                "translate(420 120) scale(1 " + s.toFixed(4) + ") translate(-420 -120)"
              );
            },
          },
          3.66
        );

        // settle flat: amplitudes collapse to the underline while the svg
        // glides down to its underline position (scale-swap handoff, outgoing)
        var flat = { f: 0 };
        tl.to(
          flat,
          {
            f: 1,
            duration: 0.52,
            ease: "power2.inOut",
            onUpdate: function () {
              wave.setAttribute("d", waveD(flat.f));
            },
          },
          4.18
        );
        tl.to("#f07cta-wavesvg", { y: 42, duration: 0.52, ease: "power2.inOut" }, 4.18);

        // scale-swap handoff, incoming: the wordmark pops in above with weight
        tl.fromTo(
          "#f07cta-word",
          { opacity: 0, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 0.58, ease: "back.out(1.6)" },
          4.4
        );

        // ambient-glow-bloom: blooms so glow + wordmark land as one beat
        tl.fromTo(
          "#f07cta-glow",
          { opacity: 0, scale: 0.85 },
          { opacity: 0.28, scale: 1, duration: 0.7, ease: "power2.out" },
          4.35
        );

        /* ── Scene 3 (5.0-7.36s) · tagline per-word, then the long calm hold ── */
        tl.fromTo(
          ".f07cta-tw",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.38, ease: "power3.out", stagger: 0.16 },
          5.15
        );

        // bounded glow breathe — finite phase proxy, one full cycle, no yoyo
        var breathe = { p: 0 };
        tl.to(
          breathe,
          {
            p: Math.PI * 2,
            duration: 2.26,
            ease: "none",
            onUpdate: function () {
              var s = Math.sin(breathe.p);
              glow.style.opacity = String(0.28 + s * 0.03);
              glow.style.transform = "scale(" + (1 + s * 0.015).toFixed(4) + ")";
            },
          },
          5.1
        );

        // subtle jitter only: whisper-level drift on the whole lockup, one cycle
        var drift = { p: 0 };
        tl.to(
          drift,
          {
            p: Math.PI * 2,
            duration: 2.31,
            ease: "none",
            onUpdate: function () {
              stage.style.transform =
                "translateY(" + (Math.sin(drift.p) * 1.6).toFixed(3) + "px)";
            },
          },
          5.05
        );
      })();
    </script>
  </div>
</template>
