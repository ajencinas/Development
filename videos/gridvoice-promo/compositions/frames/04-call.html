  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["04-call"] = tl;

      /* ── Scene 1 (0.0–1.5s) · trigger + stage ─────────────────────────── */
      /* spring-pop-entrance (smooth register, power3.out — no overshoot) */
      tl.fromTo(
        "#c04-call-chip",
        { y: -110, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.65, ease: "power3.out" },
        0.08
      );
      tl.fromTo(
        "#c04-call-panel",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.22
      );
      tl.fromTo(
        "#c04-call-chrome-inner",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out" },
        0.38
      );
      tl.fromTo(
        "#c04-call-kicker",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.55
      );
      gsap.utils.toArray(".c04-node").forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
          0.85 + i * 0.06
        );
      });

      /* ── rows · dynamic-content-sequencing (staggered land → fill → check) */
      function landRow(rowSel, tLand, tFillStart, fillDur, tCheck) {
        tl.fromTo(
          rowSel,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          tLand
        );
        /* stat-bars-and-fills fill register — scaleX, left origin, never width */
        tl.fromTo(
          rowSel + " .c04-fill",
          { scaleX: 0 },
          { scaleX: 1, duration: fillDur, ease: "power2.out" },
          tFillStart
        );
        /* amber badge flip */
        tl.fromTo(
          rowSel + " .c04-badge-in",
          { rotationX: -90, opacity: 0 },
          { rotationX: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
          tCheck
        );
      }

      /* ── Scene 2 (1.5–4.0s) · confirm + file ──────────────────────────── */
      landRow("#c04-call-row1", 1.6, 1.75, 0.45, 2.2);
      landRow("#c04-call-row2", 2.9, 3.05, 0.45, 3.5);

      /* ambient-glow-bloom · ping on the grid map — glow + node land as one beat */
      tl.fromTo(
        "#c04-call-glow",
        { opacity: 0, scale: 0.8 },
        { opacity: 0.3, scale: 1, duration: 0.6, ease: "power2.out" },
        1.95
      );
      tl.fromTo(
        "#c04-call-outage",
        { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        2.1
      );
      tl.fromTo(
        "#c04-call-ring",
        { scale: 0.25, opacity: 0.7 },
        { scale: 4.5, opacity: 0, duration: 0.9, ease: "power2.out" },
        2.1
      );
      tl.fromTo(
        "#c04-call-nodetag",
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        2.35
      );
      /* bounded breathe — finite phase tween, never a yoyo loop; sin(0)=0 */
      var glowEl = document.getElementById("c04-call-glow");
      var glowPhase = { p: 0 };
      tl.to(
        glowPhase,
        {
          p: Math.PI * 2 * 1.5,
          duration: 4.8,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(glowPhase.p);
            glowEl.style.opacity = String(0.3 + s * 0.035);
            glowEl.style.transform = "scale(" + (1 + s * 0.02) + ")";
          },
        },
        2.55
      );

      /* ── Scene 3 (4.0–6.1s) · restoration time + camera ───────────────── */
      landRow("#c04-call-row3", 4.15, 4.3, 0.5, 4.85);

      /* asr-keyword-glow — one linear driver, envelope on the "3:45 am" token */
      var ATTACK = 0.18,
        RELEASE = 0.45,
        REST = 0.35;
      var T_START = 4.55,
        T_END = 5.5;
      function envelope(t) {
        if (t < T_START) return 0;
        if (t < T_END) return Math.min((t - T_START) / ATTACK, 1);
        var relEnd = T_END + RELEASE;
        if (t < relEnd) return 1 - ((t - T_END) / RELEASE) * (1 - REST);
        return REST;
      }
      function lerpCh(a, b, t) {
        return Math.round(a + (b - a) * t);
      }
      var etaEl = document.getElementById("c04-call-eta");
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: 8,
          duration: 8,
          ease: "none",
          onUpdate: function () {
            var env = envelope(driver.t);
            etaEl.style.textShadow =
              "0 0 " + 28 * env + "px rgba(255,179,0," + (0.85 * env).toFixed(3) + ")";
            etaEl.style.transform = "scale(" + (1 + 0.12 * env) + ")";
            etaEl.style.color =
              "rgb(" +
              lerpCh(244, 255, env) +
              "," +
              lerpCh(246, 179, env) +
              "," +
              lerpCh(251, 0, env) +
              ")";
          },
        },
        0
      );

      /* coordinate-target-zoom — outer scales, inner counter-translates (T = -offset).
         Target measured from the laid-out DOM (box geometry, not glyph metrics). */
      var W = 1920,
        H = 1080;
      var r = document.getElementById("c04-call-receipt").getBoundingClientRect();
      var OFF_X = r.left + r.width / 2 - W / 2;
      var OFF_Y = r.top + r.height / 2 - H / 2;
      var maxScale = Math.min((0.88 * W) / r.width, (0.88 * H) / r.height);
      var ZS = Math.min(1.28, maxScale);
      tl.to(
        "#c04-call-zoom-outer",
        { scale: ZS, duration: 1.15, ease: "power3.inOut" },
        5.0
      );
      tl.to(
        "#c04-call-zoom-inner",
        { x: -OFF_X, y: -OFF_Y, duration: 1.15, ease: "power3.inOut" },
        5.0
      );

      /* ── Scene 4 (6.1–8.0s) · receipt stamp, settle + subtle jitter ───── */
      tl.fromTo(
        "#c04-call-receipt",
        { opacity: 0, scale: 1.5 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        6.25
      );
      tl.fromTo(
        "#c04-call-receipt .c04-fill",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        6.45
      );
      tl.fromTo(
        "#c04-call-receipt .c04-badge-in",
        { rotationX: -90, opacity: 0 },
        { rotationX: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        6.85
      );

      /* held close — bounded micro-jitter, whole sine cycles so it ends at rest */
      var jitEl = document.getElementById("c04-call-jitter");
      var jit = { p: 0 };
      tl.to(
        jit,
        {
          p: Math.PI * 2 * 2,
          duration: 1.05,
          ease: "none",
          onUpdate: function () {
            jitEl.style.transform =
              "translateY(" + (Math.sin(jit.p) * 1.3).toFixed(2) + "px)";
          },
        },
        6.9
      );
    })();
  </script>
